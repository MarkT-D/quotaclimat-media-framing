services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quota_climate
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
